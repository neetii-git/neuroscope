# NeuroScope default training configuration
seed: 42
model:
  base_channels: 32
  dropout: 0.2
data:
  modality_dropout_p: 0.5     # probability a training slice gets a random modality subset
  neg_slice_frac: 0.3         # fraction of tumour-free brain slices kept for training
  num_workers: 2
train:
  epochs: 20
  batch_size: 24
  lr: 3.0e-4
  weight_decay: 1.0e-4
  amp: true
  max_slices_per_epoch: 12000   # random subsample per epoch to bound time; null = all
  val_every: 1
  val_max_cases: 30             # cap validation cases per epoch for speed
eval:
  mc_samples: 8
  mc_samples_subsets: 4
  failure_dice_threshold: 0.75  # WT Dice below this = "failure" for the review flag
